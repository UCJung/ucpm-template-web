# postgres 프로파일 — PostgreSQL + Flyway. 스키마는 Flyway(db/migration/V{n}__*.sql)가 소유하고
# JPA는 validate로 엔티티와 실제 스키마 일치만 검증한다. 실행에는 PostgreSQL(docker-compose-local.yml)이 필요하다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webapp}
    username: ${DB_USER:webapp}
    password: ${DB_PASSWORD:webapp}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
