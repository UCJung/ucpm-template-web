# 공통 설정 + 프로파일 활성화.
# 기본 활성 프로파일은 local(H2 인메모리). PostgreSQL로 실행하려면 SPRING_PROFILES_ACTIVE=postgres.
spring:
  application:
    name: webapp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  jwt:
    # HS256 서명키(32바이트 이상). 운영 배포 시 반드시 JWT_SECRET 환경변수로 재정의한다.
    secret: ${JWT_SECRET:local-dev-only-jwt-signing-secret-please-override-in-env-32bytes-minimum}
    access-token-validity: ${JWT_ACCESS_TTL:1h}
    refresh-token-validity: ${JWT_REFRESH_TTL:7d}
  cors:
    # 프런트 Vite 기본 포트.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
